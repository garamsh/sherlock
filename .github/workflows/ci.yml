name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: make ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build-only smoke check of both platform images (ADR 0018);
      # nothing is pushed.
      - run: docker build --target agent --build-arg REVISION="$GITHUB_SHA" -t gagent-agent .
      - run: docker build --target sidecar --build-arg REVISION="$GITHUB_SHA" -t gagent-sidecar .
