name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.72.0"
      - name: Generate proto stubs and verify drift
        run: |
          make proto
          git diff --exit-code
      - name: Lint proto files
        run: buf lint
      - run: make ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Build-only smoke check of both platform images (ADR 0017);
      # nothing is pushed.
      - run: docker build --target agent --build-arg REVISION="$GITHUB_SHA" -t gagent-agent .
      - run: docker build --target workspace --build-arg REVISION="$GITHUB_SHA" -t gagent-workspace .
      # The deployment deploy/local/README.md documents must start and
      # answer a request; the step fails if the agent does not.
      - run: make smoke-local
