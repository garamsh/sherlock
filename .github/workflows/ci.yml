name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

# Every job names its runner image rather than taking `ubuntu-latest`, because
# what the privileged job and the user-namespace cases in `make ci` observe is
# the host kernel's: the clone and unshare calls ADR 0008 and ADR 0010 rest on,
# under the image's AppArmor and the container runtime's seccomp. A label that
# moves on GitHub's schedule would move that with no change here, and the next
# result would read as a verdict on whatever pull request was open (#1069).
#
# `ubuntu-24.04` is what `ubuntu-latest` resolved to before this choice: run
# 37996679960, which passed `v0.7.0`, ran on it. `ubuntu-26.04` gave the same
# result on every job, the privileged family case for case (the pull request
# closing #1069 cites both runs), so moving is a change to these lines and
# nothing else. It is due when GitHub announces the deprecation of
# `ubuntu-24.04`, and is measured again before it lands.
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod's go directive owns the toolchain version; a second
          # copy here is the shape #633 records.
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: "1.72.0"
      - run: make proto
      # Probe only (#1077): the host refuses the unprivileged user-namespace clone.
      - run: sudo sysctl -w user.max_user_namespaces=0
      # The runner is not root, so the user-namespace cases in `make ci`
      # take the unprivileged NoNetwork path (ADR 0010), and on a contributor's
      # host that refuses the clone they skip. Here a refusal would leave the
      # job green with that path untested, so the variable makes those cases
      # fail and name the refusal instead (#1077).
      - run: make ci

  # The image the privileged job runs in, read out of the Dockerfile that owns
  # the pin. A job's `container.image` cannot read a file, but it can read the
  # `needs` context, so the read happens in a job ahead of it — the one place
  # Actions makes that value computable. `make toolchain-image` is the same
  # command a contributor runs, and it refuses to emit an empty or doubled
  # read, so a Dockerfile this can no longer parse stops the job below rather
  # than pointing it somewhere else (#633).
  toolchain:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          image="$(make -s toolchain-image)"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # The shell and shipped-binary families (ADR 0008, ADR 0010) assert the drop to
  # the exec UID and the empty network namespace. Neither can be observed
  # without euid 0 and CAP_SYS_ADMIN, so on the default runner every one of
  # those cases skips and `go test` still prints ok — which is how deleting
  # the drop left the suite green (#604). A step cannot ask for a capability,
  # so the job runs in a container that holds one.
  #
  # What the tests run under is not what this container holds, and that is
  # deliberate: `make test-privileged` narrows itself to the capability set the
  # deployment grants the workspace before any case executes, reading that set
  # from deploy/local/docker-compose.yml rather than from a copy here (#620).
  # This file therefore names no capability the deployment owns — only the one
  # the runtime does not grant by default and the narrowing cannot add back.
  # The container's set is a superset on purpose: setpriv only ever drops, and
  # keeping checkout at the runner's normal privilege is what lets the whole
  # job be reproduced locally, which matters while #603 keeps the host from
  # running any of it.
  privileged:
    needs: toolchain
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.toolchain.outputs.image }}
      options: --cap-add=SYS_ADMIN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image carries the toolchain, so no setup step runs here; the
      # target refuses to run at all without root, refuses to run wider than
      # the deployment, and the family reports an unreachable boundary instead
      # of skipping past it.
      - name: Exercise shell and shipped-binary privileged Exec
        run: make test-privileged

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Build-only smoke check of both platform images (ADR 0017);
      # nothing is pushed.
      - run: make build-images REVISION="$GITHUB_SHA"
      # The deployment deploy/local/README.md documents must start and
      # answer a request; the step fails if the agent does not.
      - run: deploy/local/smoke.sh
