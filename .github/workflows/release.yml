name: release

# Action pins take the form ci.md §Pinning states — a full commit SHA, with the
# version it resolved to beside it — and .github/dependabot.yml is what moves
# them.
#
# The trigger is the release tag and nothing else: no branch, no pull request.
# A tag filter is a glob and cannot spell `vX.Y.Z`, so `v*` is as narrow as the
# trigger itself goes. It is also exactly the ref the push role admits — its
# trust policy matches the subject
# `repo:garamsh@307152666/sherlock@1311139677:ref:refs/tags/v*` — so a run on any
# other ref receives no credential even if something else starts one. What `v*`
# admits and the scheme does not is refused by the first step below, before any
# AWS call: every repository pushed to here is IMMUTABLE and a wrong name is
# permanent.
#
# Nothing here creates a tag. The tag is pushed by hand and this workflow reads
# it.
on:
  push:
    tags: ["v*"]

permissions: read-all

# No concurrency group, and the absence is the guard rather than an omission. A
# group cancels a queued run when a newer one arrives, whichever way
# `cancel-in-progress` is set, so a `vX.Y.Z` tag could publish nothing; and a
# run cancelled between the pushes leaves the version part-published, which no
# re-push repairs because the name is already taken.

jobs:
  publish:
    # The same image ci.yml names, for its reason: the images are built here on
    # the host ci.yml's `docker` job checks them on (#1069).
    runs-on: ubuntu-24.04
    permissions:
      # A job's block replaces the workflow's rather than adding to it, so the
      # read the checkout needs is written here beside the federated push
      # credential — the one job that needs write holds it (ci.md §Security
      # baseline). This job writes nothing back to the repository.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deployment.md §Images and tags: a `v`-prefixed git tag publishes the
      # image tagged without the `v`. This step stands before the credential
      # exists, so a tag the scheme does not name costs nothing at all. The tag
      # name reaches the shell through the environment rather than being
      # interpolated into the command text (ci.md §Security baseline).
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $REF_NAME is not vX.Y.Z: nothing published" >&2
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Every image is built before any is pushed, and one command builds them
      # all. That is the binding constraint of this workflow (#758, #770): the
      # two are a set that has to agree (ADR 0017, ADR 0021), every repository
      # is IMMUTABLE, and a version whose later image failed after an earlier one
      # was pushed is repaired only by abandoning the name. Building through
      # `docker/buildx-push-action` with `push: true`, once per image, is the
      # shape that cannot hold that property, so this workflow does not use it.
      #
      # The agent image carries the first-party tools at /opt/sherlock/tools/
      # (ADR 0021); there is no separate sherlock/tools image and no third
      # image to push. The workspace image is unchanged.
      #
      # Every image lands under `garam/` in the registry, the convention
      # the account's other applications follow. Production tags are
      # semver (`0.1.0`, `0.1.1`, ...) — release tags from a `v`-prefixed
      # git tag with the `v` stripped. Development tags are the commit
      # short SHA; those go in by hand, not through this workflow
      # (deployment.md §Images and tags).
      #
      # The name invoked is the one a contributor invokes and the `docker` job
      # in ci.yml already invokes (ci.md §One entry point per task); the
      # Makefile owns the commands behind it and pushes nothing.
      #
      # No buildx builder is set up, deliberately: `docker build` on the
      # default driver writes each image into the local image store, which is
      # where the push below finds it. Selecting a `docker-container` builder
      # would leave the result in a build cache with nothing for `docker push`
      # to take. That what it writes is one manifest and not an index is the
      # Makefile's doing — it turns off the attestations buildx attaches by
      # default, which would otherwise be carried in an index over the image —
      # and the last step of this job reads the registry back to check it.
      #
      # REVISION is passed, so each image is labelled and tagged with the
      # commit the tag points at, and the Makefile's dirty-tree comparison —
      # a contributor's guard, not a pipeline's — does not run (deployment.md
      # §Images and tags).
      - run: make build-images REVISION="$GITHUB_SHA"

      # Every step above this line is reversible, so the credential is obtained
      # after them: a build that fails, on any image, fails before this
      # workflow is able to push anything.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::486152169996:role/github-actions-sherlock
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # The only irreversible step. Every local image is renamed first, so a
      # reference this cannot form fails before any upload begins.
      #
      # `sherlock-<image>:<revision>` is the name the Makefile writes for each
      # of the two. They are not re-derived here: a rename there leaves
      # `docker tag` with no such image, which fails this step rather than
      # pushing something else.
      - env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for image in agent workspace; do
            docker tag "sherlock-$image:$GITHUB_SHA" "$REGISTRY/garam/sherlock-$image:$VERSION"
          done
          for image in agent workspace; do
            docker push "$REGISTRY/garam/sherlock-$image:$VERSION"
          done

      # What the registry holds, read back from the registry rather than from a
      # local rebuild (#756). Two things: the digest each reference resolves to,
      # which is what a consumer pins (ADR 0020) and what this run has no other
      # place to publish; and that the object behind it is a single manifest and
      # not an index, so that digest names the image.
      #
      # It necessarily runs after the irreversible step, because there is
      # nothing to read before it. A failure here therefore reads "the registry
      # does not hold what this run meant to publish", never "nothing was
      # published": the version is already taken and the repair is the next one.
      #
      # The read is `aws ecr batch-get-image`, which needs `ecr:BatchGetImage`
      # alone — an action the push role holds because the push calls it.
      # `docker buildx imagetools inspect` also downloads a blob, which needs
      # `ecr:GetDownloadUrlForLayer`, and the role lacks that (#960). A tag that
      # resolves to nothing returns no image, only a `failures` entry, so a
      # missing digest is refused before the media type is read.
      - env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for image in agent workspace; do
            ref="$REGISTRY/garam/sherlock-$image:$VERSION"
            fields=$(aws ecr batch-get-image \
              --repository-name "garam/sherlock-$image" \
              --image-ids imageTag="$VERSION" \
              --query 'images[0].[imageManifestMediaType, imageId.imageDigest]' \
              --output text)
            read -r media digest <<<"$fields"
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "$ref: the registry returned no image for that tag" >&2
              exit 1
            fi
            case "$media" in
              application/vnd.docker.distribution.manifest.v2+json | application/vnd.oci.image.manifest.v1+json) ;;
              *)
                echo "$ref: the registry holds $media, so that digest names an index and not the image" >&2
                exit 1
                ;;
            esac
            printf '%s@%s\n' "$ref" "$digest"
            printf -- '- `%s@%s`\n' "$ref" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
