# Example agent config. The mock provider is scripted and needs no API
# key, so the agent runs fully offline against a local workspace.
# addr binds loopback: a non-loopback bind requires a tls: section
# (ADR 0012); see README.md's config table.
# The agent executes nothing itself — the workspace owns process exec
# (ADR 0017) — so exec-uid and exec-timeout are workspace keys; the
# agent only needs the workspace's address.
addr: "127.0.0.1:8080"
# agent-id: default                     # default; CLI flag is the supported path today (override at startup)
# memory-path: data/memory.db            # default; the agent's SQLite memory file
# workspace-addr: "127.0.0.1:8081"        # default; gRPC endpoint of the agent's workspace
model:
  # provider names the wire protocol the endpoint speaks, not the vendor:
  # mock (scripted, offline), openai-compatible (chat-completions) or
  # anthropic-compatible (the Messages protocol). base-url is what picks
  # the vendor, so OpenAI, MiniMax, Ollama and vLLM all reach the agent
  # through the openai-compatible value.
  provider: mock
# The MiniMax configuration this project runs on (README.md §Pointing at a
# MiniMax endpoint, which also records what that endpoint does not honour):
#   provider: openai-compatible
#   base-url: https://api.minimax.io/v1
#   model: MiniMax-M2
#   api-key-env: MINIMAX_KEY
# embedding: ranks older conversation for recall. The mock provider embeds
# offline and ignores it; every other provider needs an OpenAI-compatible
# /embeddings endpoint here (README.md §Embeddings). A local server needs no
# key, so api-key-env stays unset for one:
# embedding:
#   base-url: http://127.0.0.1:8090/v1
#   model: BAAI/bge-base-en-v1.5
#   api-key-env: EMBEDDING_KEY            # for a hosted endpoint
# Tools: the agent reads ./tools/<name>/manifest.json at startup
# (ADR 0009 §Decision). The six first-party tools (file_read, file_write,
# file_list, shell_exec, message_send, github) ship in place under tools/; a `make build-tools`
# compile keeps the binaries current. Override the directory with the
# tools-dir key, or drop a custom tool into ./tools/<name>/ with its own
# manifest.json and binary. The github tool rejects startup without
# GH_TOKEN, so either set GH_TOKEN in the agent's env or remove
# tools/github/ to run without it.
# tools-dir: ./tools
#
# tools.pins is the accepted tool set: the SHA-256 of each manifest you
# reviewed, which the agent logs on the "tool manifest loaded" line for
# every tool it loads. With the section present the agent refuses a
# manifest that drifted from its pin and a tool the set does not name;
# without it the agent loads the tree unpinned and warns (ADR 0009
# invariant 2). Left out here so a fresh checkout runs before its
# manifests have been reviewed. The pin set is a config-file key only:
# a pin set is a map and one environment variable carries one value, so
# SHERLOCK_TOOLS_PINS is refused at startup rather than read (#745).
# tools:
#   pins:
#     message_send: <sha256 of tools/message_send/manifest.json>
#     file_read: <sha256 of tools/file_read/manifest.json>
#     file_write: <sha256 of tools/file_write/manifest.json>
#     file_list: <sha256 of tools/file_list/manifest.json>
