# Egress control at the pod layer (ADR 0018): the in-process network
# namespace is no longer the mechanism. This stub denies pod egress by
# default and documents where real policy lands; tighten podSelector and
# the rules per deployment. The agent↔sidecar contract is loopback
# traffic inside the pod and never crosses this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gagent-egress
spec:
  podSelector:
    matchLabels:
      app: gagent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The orchestration layer reaches the gateway; narrow fromPods per
    # deployment. The contract listener is pod-local and unreachable
    # from the network by construction.
    - ports:
        - port: 8080
  egress:
    # DNS resolution for the console endpoint and tool servers.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Add per-deployment rules here: the console endpoint (the mouth's
    # delivery target) and any external tool servers the agent's
    # tool-servers list names. Script tools on the sidecar are
    # operator-sanctioned egress channels (ADR 0014) — their
    # destinations belong in this list too.
