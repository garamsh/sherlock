# One agent pod (ADR 0018): the agent container (self) and the sidecar
# container (computer), each with its own volume. The contract listener
# stays on the pod's loopback, so no Service or network path exposes the
# sidecar. Build the images per the repo-root Dockerfile
# (--target agent / --target sidecar) and set the image names below.
apiVersion: v1
kind: Pod
metadata:
  name: gagent-demo
  labels:
    app: gagent
    agent-id: demo
spec:
  containers:
    - name: agent
      image: gagent-agent:latest
      args: ["agent", "--agent-id", "demo"]
      env:
        - name: GAGENT_MEMORY_PATH
          value: /data/memory/memory.db
        - name: GAGENT_ADDR
          value: ":8080"
        - name: GAGENT_MODEL_PROVIDER
          value: mock
      ports:
        - name: gateway
          containerPort: 8080
      # Serving beyond loopback requires the tls: section (ADR 0013).
      # Mount a Secret with server.pem/server-key.pem/ca.pem at
      # /etc/gagent/tls (throwaway-CA flow: deploy/local/README.md) and
      # a ConfigMap with the matching config file at /etc/gagent, then
      # pass --config /etc/gagent/gagent.yaml in args.
      volumeMounts:
        - name: memory
          mountPath: /data/memory
        # - name: tls
        #   mountPath: /etc/gagent/tls
        #   readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
      readinessProbe:
        tcpSocket:
          port: gateway
    - name: sidecar
      image: gagent-sidecar:latest
      args: ["sidecar"]
      env:
        - name: GAGENT_WORKSPACE
          value: /data/workspace
      volumeMounts:
        - name: workspace
          mountPath: /data/workspace
      # The executor's privilege drop, made real (ADR 0008, ADR 0010):
      # SETUID/SETGID for the child credential drop, CHOWN for the
      # workspace hand-off, SYS_ADMIN for the netns unshare. The
      # sidecar runs as root with exactly these capabilities.
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
          add: ["SETUID", "SETGID", "CHOWN", "SYS_ADMIN"]
  volumes:
    # emptyDir keeps the manifest cluster-free; production wants a PVC
    # per agent for both volumes.
    - name: memory
      emptyDir: {}
    - name: workspace
      emptyDir: {}
    # - name: tls
    #   secret:
    #     secretName: gagent-tls
  restartPolicy: Always
