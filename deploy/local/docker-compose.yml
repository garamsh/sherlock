# Local testing only: trusted host, throwaway mTLS certs in ./tls.
# Requires GAGENT_DATA_DIR; see README.md in this directory.
services:
  gagent:
    build:
      context: ../..
    ports:
      - "8080:8080"
    environment:
      GAGENT_DATA_ROOT: "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}"
    volumes:
      # The data root sits at the same absolute path on host and container
      # so environment paths are valid from either side.
      - "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}:${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}"
      - ./gagent.yaml:/etc/gagent/config.yaml:ro
      - ./tls:/etc/gagent/tls:ro
    command: ["gateway", "--config", "/etc/gagent/config.yaml"]
