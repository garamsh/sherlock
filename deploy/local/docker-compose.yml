# Local testing only: trusted host, throwaway mTLS certs in ./tls.
# Requires GAGENT_DATA_DIR; see README.md in this directory.
# Two services, one pod shape (ADR 0018): the agent serves its gateway;
# the sidecar shares the agent's network namespace so the unauthenticated
# contract listener stays on loopback (#209).
services:
  agent:
    build:
      context: ../..
      target: agent
    ports:
      - "8080:8080"
    environment:
      # The memory file sits at the same absolute path on host and
      # container so it is valid from either side.
      GAGENT_MEMORY_PATH: "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}/memory.db"
    volumes:
      - "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}:${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}"
      - ./gagent.yaml:/etc/gagent/config.yaml:ro
      - ./tls:/etc/gagent/tls:ro
    command: ["agent", "--config", "/etc/gagent/config.yaml", "--agent-id", "demo"]
  sidecar:
    build:
      context: ../..
      target: sidecar
    network_mode: service:agent
    depends_on:
      - agent
    # The executor's privilege drop, made real (ADR 0008, ADR 0010):
    # SETUID/SETGID for the child credential drop, CHOWN for the
    # workspace hand-off, SYS_ADMIN for the netns unshare. Nothing else.
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "SYS_ADMIN"]
    environment:
      GAGENT_WORKSPACE: "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}/workspace"
    volumes:
      - "${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}:${GAGENT_DATA_DIR:?export GAGENT_DATA_DIR per README.md}"
    command: ["sidecar"]
