syntax = "proto3";

package computer;
option go_package = "github.com/garamsh/gagent/internal/computer;computer";

service Computer {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
}
message ReadRequest { string path = 1; }
message ReadResponse { bytes content = 1; }
message WriteRequest { string path = 1; bytes content = 2; }
message WriteResponse {}
message ListRequest { string path = 1; }
message Entry { string name = 1; bool dir = 2; }
message ListResponse { repeated Entry entries = 1; }
message ExecRequest { string command = 1; repeated string args = 2; bytes stdin = 3; int64 timeout_nanos = 4; string workdir = 5; repeated string env = 6; bool no_network = 7; bool trusted = 8; }
message ExecResponse { string stdout = 1; string stderr = 2; int32 exit_code = 3; bool timed_out = 4; }
