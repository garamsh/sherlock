syntax = "proto3";

package workspace;
option go_package = "github.com/garamsh/sherlock/internal/workspace;workspace";

// Workspace is the data plane the agent uses for its working environment
// (ADR 0017): it serves the filesystem (Read, Write, List) and runs
// agent-influenced processes (Exec) in the workspace directory. It
// exposes no tool hosting: tools are executables the agent's tool
// client spawns from their manifests. Its callers are those tools and
// the `sherlock workspace` operation subcommands (ADR 0027). The plugin
// concept is dropped.
service Workspace {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
}
message ReadRequest { string path = 1; }
message ReadResponse { bytes content = 1; }
message WriteRequest { string path = 1; bytes content = 2; }
message WriteResponse {}
message ListRequest { string path = 1; }
message Entry { string name = 1; bool dir = 2; }
message ListResponse { repeated Entry entries = 1; }
message ExecRequest { string command = 1; repeated string args = 2; bytes stdin = 3; int64 timeout_nanos = 4; string workdir = 5; repeated string env = 6; bool no_network = 7; bool trusted = 8; }
message ExecResponse { string stdout = 1; string stderr = 2; int32 exit_code = 3; bool timed_out = 4; }