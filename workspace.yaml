# Example workspace config. The workspace serves the filesystem-only
# gRPC data plane (Read/Write/List) — it does not host tools or run
# processes (ADR 0018). Tools are agent-side Go packages the agent
# imports at compile time.
# The workspace listener is unauthenticated in this phase and serves
# loopback binds only; a non-loopback addr fails startup.
addr: "127.0.0.1:8081"
workspace: data/workspace
# exec-uid: 1001    # default; a privileged workspace chowns the workspace directory to the agent's exec UID
